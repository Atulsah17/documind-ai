# Render Blueprint — deploys the FastAPI backend as a Docker web service.
# 1. Push this repo to GitHub
# 2. On https://render.com → New → Blueprint → pick this repo
# 3. Set LLM_PROVIDER + the matching API key in the dashboard for real answers.
services:
  - type: web
    name: documind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: mock          # change to groq / openai / azure and add the key below
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
