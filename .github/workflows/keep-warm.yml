name: Keep API Warm

# Render's free tier sleeps after ~15 min idle. This pings the health endpoint
# every ~14 min so the live demo is always instant for visitors. Free on public repos.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          echo "Pinging DocuMind API…"
          curl -sS --max-time 90 https://documind-api-4w9b.onrender.com/api/health || true
          echo ""
